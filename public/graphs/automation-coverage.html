<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Automation coverage by workflow</title>
    <style>
      /* ----------------------------------------------------------------
         This file is a standalone example. Replace it with whatever HTML
         your tool exports (Plotly, Observable, matplotlib --to-html, a
         hand-written chart like this one) and it will embed the same way.

         The only thing worth keeping is the theme block at the bottom of
         this <script>: it lets the parent site tell this page which theme
         to use, so the chart matches the site's dark-mode toggle.
      ---------------------------------------------------------------- */
      :root {
        color-scheme: light;
        --surface: #ffffff;
        --text-primary: #16161a;
        --text-secondary: #56565f;
        --text-muted: #85858e;
        --grid: #e9e9e6;
        --axis: #d3d3ce;
        --series-1: #2a78d6;
        --series-2: #eb6834;
      }
      @media (prefers-color-scheme: dark) {
        :root:where(:not([data-theme="light"])) {
          color-scheme: dark;
          --surface: #121316;
          --text-primary: #f2f2f4;
          --text-secondary: #a2a4ac;
          --text-muted: #73757d;
          --grid: #23252a;
          --axis: #35383f;
          --series-1: #3987e5;
          --series-2: #d95926;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --surface: #121316;
        --text-primary: #f2f2f4;
        --text-secondary: #a2a4ac;
        --text-muted: #73757d;
        --grid: #23252a;
        --axis: #35383f;
        --series-1: #3987e5;
        --series-2: #d95926;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        padding: 20px;
        background: var(--surface);
        color: var(--text-primary);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 14px;
      }

      .head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; }
      h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .sub { margin: 4px 0 0; font-size: 12.5px; color: var(--text-secondary); }

      .legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
      .legend-item { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-secondary); }
      .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }

      .chart-wrap { position: relative; margin-top: 18px; }
      svg { display: block; width: 100%; height: auto; overflow: visible; }

      .grid-line { stroke: var(--grid); stroke-width: 1; }
      .axis-line { stroke: var(--axis); stroke-width: 1; }
      .tick { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
      .series-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .end-label { font-size: 11.5px; font-weight: 600; fill: var(--text-primary); }
      .crosshair { stroke: var(--axis); stroke-width: 1; stroke-dasharray: 3 3; }
      .dot { stroke: var(--surface); stroke-width: 2; }

      .tooltip {
        position: absolute;
        pointer-events: none;
        min-width: 150px;
        padding: 9px 11px;
        border-radius: 8px;
        background: var(--surface);
        border: 1px solid var(--axis);
        box-shadow: 0 6px 20px rgb(0 0 0 / 0.12);
        font-size: 12.5px;
        opacity: 0;
        transition: opacity 0.1s;
        z-index: 5;
      }
      .tooltip.on { opacity: 1; }
      .tt-title { font-weight: 600; margin-bottom: 6px; }
      .tt-row { display: flex; align-items: center; gap: 7px; margin-top: 3px; color: var(--text-secondary); }
      .tt-val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text-primary); font-weight: 600; }

      .foot { margin-top: 14px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
      .note { font-size: 11.5px; color: var(--text-muted); margin: 0; }
      .toggle {
        font: inherit; font-size: 12px; cursor: pointer;
        background: none; color: var(--text-secondary);
        border: 1px solid var(--axis); border-radius: 999px; padding: 4px 11px;
      }
      .toggle:hover { color: var(--text-primary); }

      table { border-collapse: collapse; width: 100%; margin-top: 14px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
      th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--grid); }
      th:first-child, td:first-child { text-align: left; }
      th { color: var(--text-secondary); font-weight: 600; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div class="head">
      <div>
        <h1>Share of volume handled without human touch</h1>
        <p class="sub">Two workflows, monthly, 2025</p>
      </div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="chart-wrap">
      <svg id="chart" viewBox="0 0 760 340" role="img"
           aria-label="Line chart showing automation coverage rising through 2025 for two workflows: claims triage from 22% to 78%, and supplier documents from 15% to 64%."></svg>
      <div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>
    </div>

    <div class="foot">
      <p class="note">Illustrative data — replace this file with your own export.</p>
      <button class="toggle" id="toggle" aria-expanded="false" aria-controls="table">Show data table</button>
    </div>
    <table id="table" hidden></table>

    <script>
      // ---- Data -------------------------------------------------------
      const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      const series = [
        { name: "Claims triage",   color: "var(--series-1)", values: [22,30,37,41,48,53,58,62,66,71,75,78] },
        { name: "Supplier docs",   color: "var(--series-2)", values: [15,18,26,34,39,44,46,52,55,57,61,64] },
      ];

      // ---- Geometry ---------------------------------------------------
      const W = 760, H = 340;
      // Right margin leaves room for the direct end-labels.
      const M = { top: 16, right: 152, bottom: 34, left: 38 };
      const plotW = W - M.left - M.right;
      const plotH = H - M.top - M.bottom;
      const yMax = 100;

      const x = (i) => M.left + (i / (months.length - 1)) * plotW;
      const y = (v) => M.top + plotH - (v / yMax) * plotH;

      const svg = document.getElementById("chart");
      const NS = "http://www.w3.org/2000/svg";
      const el = (tag, attrs = {}) => {
        const n = document.createElementNS(NS, tag);
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
        return n;
      };

      // Gridlines + y ticks (recessive, behind the data).
      for (let v = 0; v <= yMax; v += 25) {
        svg.appendChild(el("line", { class: v === 0 ? "axis-line" : "grid-line", x1: M.left, x2: M.left + plotW, y1: y(v), y2: y(v) }));
        const t = el("text", { class: "tick", x: M.left - 9, y: y(v) + 4, "text-anchor": "end" });
        t.textContent = v + "%";
        svg.appendChild(t);
      }

      // X ticks — every other month so labels never collide on narrow screens.
      months.forEach((m, i) => {
        if (i % 2 !== 0) return;
        const t = el("text", { class: "tick", x: x(i), y: M.top + plotH + 20, "text-anchor": "middle" });
        t.textContent = m;
        svg.appendChild(t);
      });

      // Series lines + direct end-labels (identity is never colour alone).
      series.forEach((s) => {
        const d = s.values.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(" ");
        svg.appendChild(el("path", { class: "series-line", d, stroke: s.color }));

        const last = s.values.length - 1;
        const label = el("text", { class: "end-label", x: x(last) + 12, y: y(s.values[last]) + 4 });
        label.textContent = `${s.name} · ${s.values[last]}%`;
        svg.appendChild(label);
      });

      // ---- Legend -----------------------------------------------------
      document.getElementById("legend").innerHTML = series
        .map((s) => `<span class="legend-item"><span class="swatch" style="background:${s.color}"></span>${s.name}</span>`)
        .join("");

      // ---- Hover: crosshair + tooltip ---------------------------------
      const crosshair = el("line", { class: "crosshair", y1: M.top, y2: M.top + plotH, opacity: 0 });
      svg.appendChild(crosshair);
      const dots = series.map((s) => {
        const c = el("circle", { class: "dot", r: 4.5, fill: s.color, opacity: 0 });
        svg.appendChild(c);
        return c;
      });

      const tooltip = document.getElementById("tooltip");
      const hit = el("rect", { x: M.left, y: M.top, width: plotW, height: plotH, fill: "transparent" });
      svg.appendChild(hit);

      function showAt(i, clientX) {
        crosshair.setAttribute("x1", x(i));
        crosshair.setAttribute("x2", x(i));
        crosshair.setAttribute("opacity", 1);
        dots.forEach((dot, si) => {
          dot.setAttribute("cx", x(i));
          dot.setAttribute("cy", y(series[si].values[i]));
          dot.setAttribute("opacity", 1);
        });

        tooltip.innerHTML =
          `<div class="tt-title">${months[i]} 2025</div>` +
          series
            .map((s) => `<div class="tt-row"><span class="swatch" style="background:${s.color}"></span>${s.name}<span class="tt-val">${s.values[i]}%</span></div>`)
            .join("");
        tooltip.classList.add("on");

        // Position in page pixels, flipping before it can overflow the frame.
        const wrap = svg.parentElement.getBoundingClientRect();
        const px = ((x(i) / W) * wrap.width);
        const flip = px + 170 > wrap.width;
        tooltip.style.left = (flip ? px - 162 : px + 14) + "px";
        tooltip.style.top = "12px";
      }

      function hide() {
        crosshair.setAttribute("opacity", 0);
        dots.forEach((d) => d.setAttribute("opacity", 0));
        tooltip.classList.remove("on");
      }

      function nearestIndex(evt) {
        const box = svg.getBoundingClientRect();
        const svgX = ((evt.clientX - box.left) / box.width) * W;
        const ratio = (svgX - M.left) / plotW;
        return Math.max(0, Math.min(months.length - 1, Math.round(ratio * (months.length - 1))));
      }

      hit.addEventListener("pointermove", (e) => showAt(nearestIndex(e), e.clientX));
      hit.addEventListener("pointerleave", hide);

      // ---- Table view (accessible alternative to the plot) ------------
      const table = document.getElementById("table");
      table.innerHTML =
        `<thead><tr><th>Month</th>${series.map((s) => `<th>${s.name}</th>`).join("")}</tr></thead>` +
        `<tbody>${months
          .map((m, i) => `<tr><td>${m}</td>${series.map((s) => `<td>${s.values[i]}%</td>`).join("")}</tr>`)
          .join("")}</tbody>`;

      const toggle = document.getElementById("toggle");
      toggle.addEventListener("click", () => {
        const nowHidden = !table.hidden;
        table.hidden = nowHidden;
        toggle.setAttribute("aria-expanded", String(!nowHidden));
        toggle.textContent = nowHidden ? "Show data table" : "Hide data table";
        reportHeight();
      });

      // ---- Talking to the parent site ---------------------------------
      // 1. Theme: the site posts {type:'theme'} when the toggle is used, and
      //    passes the initial value in the URL hash (#theme=dark).
      function applyTheme(theme) {
        if (theme === "dark" || theme === "light") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      }
      applyTheme(new URLSearchParams(location.hash.slice(1)).get("theme"));

      window.addEventListener("message", (e) => {
        if (e.data && e.data.type === "theme") applyTheme(e.data.theme);
        // Any message from the parent is also a cue to re-report our height:
        // this page usually finishes loading before the parent has hydrated
        // and attached its listener, so the first report can go unheard.
        reportHeight();
      });

      // 2. Height: tell the parent how tall we are so the iframe can size
      //    itself instead of scrolling.
      //
      //    When embedded we suppress our own scrollbar. Without this, resizing
      //    the frame can show/hide a scrollbar, which changes our width, which
      //    changes our height — an oscillation that never settles. Standalone
      //    (via "Open full size") the page scrolls normally.
      const isEmbedded = window.parent !== window;
      if (isEmbedded) document.documentElement.style.overflow = "hidden";

      function reportHeight() {
        const h = Math.ceil(document.body.getBoundingClientRect().height) + 40;
        parent.postMessage({ type: "graph-height", height: h }, "*");
      }
      window.addEventListener("load", reportHeight);
      // Covers late font loading and the data-table toggle.
      new ResizeObserver(reportHeight).observe(document.body);
      reportHeight();
    </script>
  </body>
</html>
